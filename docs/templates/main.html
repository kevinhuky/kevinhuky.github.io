{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  {# Structured data for blog posts (search engines rich results) #}
  {% if page and page.file and page.file.src_uri.startswith("blog/posts/") %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | tojson }},
    "description": {{ (page.meta.description or config.site_description) | tojson }},
    "url": {{ page.canonical_url | tojson }},
    {% if page.meta.date %}
    "datePublished": {{ page.meta.date | string | tojson }},
    {% endif %}
    "author": {
      "@type": "Person",
      "name": "{{ config.site_author }}",
      "url": "https://github.com/riohuky"
    },
    "publisher": {
      "@type": "Person",
      "name": "{{ config.site_author }}"
    },
    "inLanguage": "zh-CN"
  }
  </script>
  {% endif %}

  {# GoatCounter 访问统计：无 cookie、异步加载，本地预览（localhost）自动不计数 #}
  <script data-goatcounter="https://riohuky.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
{% endblock %}
