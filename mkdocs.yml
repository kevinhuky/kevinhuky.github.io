#[Info]
site_name: RioHu's Website
site_url: https://riohu.com
site_author: Rio HU
site_description: Rio 的个人博客：Java 后端、AI 编程工具与独立开发的技术笔记和随想。

copyright: Copyright &copy; 2026 Rio HU
#[Config]
#[Repo Config]
repo_url: https://github.com/riohuky/riohuky.github.io
repo_name: riohuky.github.io

#[扩展]
extra:
    generator: false
    include:
      - CNAME
    consent:
        title: Cookie consent
        description: >-
          We use cookies to recognize your repeated visits and preferences, as well
          as to measure the effectiveness of our documentation and whether users
          find what they're searching for. With your consent, you're helping us to
          make our documentation better.
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/riohuky

        - icon: fontawesome/solid/paper-plane
          link: mailto:contact@riohu.com

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - footnotes
  - admonition    
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

#[UI]
theme:
    name: 'material'                            #主题名
    favicon: assets/logo/logo.png
    language: zh
    font:
        text: Noto Sans SC                      #思源黑体，按需子集加载（含真 700 字重）
    palette:
        # 跟随系统偏好的浅色 / 深色模式，可手动切换
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: white
          accent: indigo
          toggle:
              icon: material/weather-night
              name: 切换到深色模式
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: black
          accent: indigo
          toggle:
              icon: material/weather-sunny
              name: 切换到浅色模式
    custom_dir: docs/templates
    icon:
        repo: fontawesome/brands/github         #指定仓库图标
    features:
        - search.suggest  # 启用搜索建议
        - navigation.tabs                       #在header中添加导航条
        - navigation.tabs.sticky
        - navigation.top                        #回到顶部
        - navigation.path
        - navigation.instant
        - navigation.indexes
        - navigation.prune
        - navigation.sections
        - content.blog                          # 启用博客内容特性
        - content.tabs.link                     # 启用内容标签链接
        - content.code.annotate
        - content.code.copy                     # 代码块一键复制
        - header.autohide                       # 滚动时自动隐藏/显示导航条

plugins:
  - autorefs
  - tags
  - social:
      enabled: !ENV [CI, false]   # 社交分享卡片仅在 CI 构建时生成
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  - blog:
      draft: true
      post_url_format: "{slug}"   # 简洁永久链接：/blog/<slug>/
  - search:
      # Material 官方推荐的分词 separator（字符类中含零宽空格 U+200B）
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
#   - bibtex:
#       bib_file: "docs/references.bib"
#       csl_file: "docs/ieee.csl"
#       cite_inline: false

extra_css:
  - css/extra.css  # 加载自定义 CSS

nav:
  - About: index.md
  - Blog:
     - blog/index.md
     - 标签: blog/tags.md
    

